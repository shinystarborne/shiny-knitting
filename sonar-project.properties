# SonarCloud, for the analysis run by .github/workflows/sonarcloud.yml.
sonar.organization=shinystarborne
sonar.projectKey=shinystarborne_shiny-knitting
sonar.projectName=Shiny Knitting

# The app, frontend and backend, and the scripts beside it are the sources;
# the browser harness is their tests. Built output, downloads and test files
# are not analysed.
sonar.sources=.
sonar.exclusions=harness/**,node_modules/**,dist/**,dist-harness/**,coverage/**,src-tauri/target/**,src-tauri/gen/**,src-tauri/icons/**,public/fixtures/**,fixtures/**
sonar.tests=harness

# Coverage: the Rust tests (cargo llvm-cov) and the browser checks
# (harness/coverage.mjs). The scripts that make test files, and the build
# configuration, have no tests of their own.
sonar.rust.lcov.reportPaths=coverage/rust.lcov
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info
sonar.coverage.exclusions=*.py,*.mjs,vite.config.ts,docs/**,src-tauri/build.rs,src-tauri/src/main.rs

sonar.python.version=3.13
