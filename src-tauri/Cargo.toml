[package]
name = "shiny-knitting-app"
version = "0.3.9"
description = "A reading app for knitting patterns with row counters and a moving highlight line."
authors = ["Shiny"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "shiny_knitting_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
# AI providers. rustls keeps us off OpenSSL, which is not present on a stock
# Windows install.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "charset",
    "http2",
] }
tokio = { version = "1", features = ["time", "macros", "rt"] }
# Used only to wrap the OpenRouter key with Windows DPAPI, so the stored
# secret cannot be read by anything other than this Windows user account.
windows = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
