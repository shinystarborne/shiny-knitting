# Runs the tests with coverage on every push to main and every pull request,
# then sends the analysis and the coverage to SonarCloud.
#
# The SonarCloud step runs only once the repository has a SONAR_TOKEN secret,
# and needs Automatic Analysis switched off in SonarCloud first (Administration
# → Analysis Method): the two cannot both analyse the project. Until then the
# tests and coverage still run, and their results are in the job.
#
# Windows, as the app is built for it: the Rust tests run as they do on the
# desk, and Chrome is already on the runner for the browser checks.
name: Tests, coverage and SonarCloud

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The whole history: SonarCloud uses it to tell new code from old.
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          # monocart-coverage-reports 3 needs Node 22.15 or newer.
          node-version: 24
          cache: npm

      - run: npm ci

      # The Rust build embeds the built frontend (tauri.conf.json frontendDist).
      - name: Build the frontend
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2.90.6
        with:
          tool: cargo-llvm-cov

      - name: Rust tests, with coverage
        working-directory: src-tauri
        run: |
          mkdir -p ../coverage
          cargo llvm-cov --lcov --output-path ../coverage/rust.lcov

      - name: Browser checks, with coverage
        run: |
          npx vite --config harness/vite.harness.config.ts > "$RUNNER_TEMP/vite.log" 2>&1 &
          "/c/Program Files/Google/Chrome/Application/chrome.exe" --headless=new --remote-debugging-port=9222 \
            --window-size=1400,900 --user-data-dir="$RUNNER_TEMP/chrome" about:blank > /dev/null 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:1421/harness/index.html > /dev/null && curl -sf http://localhost:9222/json/version > /dev/null && break
            sleep 1
          done
          node harness/coverage.mjs

      - name: SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.5.0
