<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Harness</title>
  </head>
  <body>
    <div id="app"></div>
    <!--
      The stub has to be a module so a production build bundles it, and it is
      listed before the app so the IPC layer exists by the time the app calls
      it. A plain <script src> would be dropped from the build output.

      The check modules are listed for the same reason, so a driver can call
      window.__layoutChecks(), __rowChecks(), __annotationChecks(),
      __bulkAddChecks(), __updateChecks(), __yarnStashChecks(), __toolChecks()
      __projectChecks(), __yarnWeightChecks(), __needleSizeChecks(),
      __shoppingChecks(), __peopleChecks(), __swatchChecks(),
      __calculatorChecks(), __logChecks(), __chartChecks(),
      __stashHistoryChecks(), __savePagesChecks(), __planChecks(), __galleryChecks(), __counterProjectChecks(), __backupChecks(), __binChecks(), __uploadChecks(), __chartLineChecks(), __cropChecks(), __pinFrontChecks(), __zoomChecks(), __pageModeChecks(), __themeChecks(), __besideChecks(), __markMoveChecks() and __eraserChecks().

      no-dialogs.js comes first so the harness behaves like the real app, where
      window.prompt, confirm and alert do not work. See the file for why.
    -->
    <script type="module" src="/harness/no-dialogs.js"></script>
    <script type="module" src="/harness/stub.js"></script>
    <script type="module" src="/harness/layout-checks.js"></script>
    <script type="module" src="/harness/row-checks.js"></script>
    <script type="module" src="/harness/annotation-checks.ts"></script>
    <script type="module" src="/harness/bulk-add-checks.js"></script>
    <script type="module" src="/harness/update-checks.js"></script>
    <script type="module" src="/harness/yarn-stash-checks.js"></script>
    <script type="module" src="/harness/tool-checks.ts"></script>
    <script type="module" src="/harness/project-checks.ts"></script>
    <script type="module" src="/harness/yarn-weight-checks.ts"></script>
    <script type="module" src="/harness/needle-size-checks.ts"></script>
    <script type="module" src="/harness/shopping-checks.ts"></script>
    <script type="module" src="/harness/people-checks.ts"></script>
    <script type="module" src="/harness/swatch-checks.ts"></script>
    <script type="module" src="/harness/calculator-checks.ts"></script>
    <script type="module" src="/harness/log-checks.ts"></script>
    <script type="module" src="/harness/chart-checks.ts"></script>
    <script type="module" src="/harness/stash-history-checks.ts"></script>
    <script type="module" src="/harness/save-pages-checks.ts"></script>
    <script type="module" src="/harness/plan-checks.ts"></script>
    <script type="module" src="/harness/gallery-checks.ts"></script>
    <script type="module" src="/harness/counter-project-checks.ts"></script>
    <script type="module" src="/harness/backup-checks.ts"></script>
    <script type="module" src="/harness/bin-checks.ts"></script>
    <script type="module" src="/harness/upload-checks.ts"></script>
    <script type="module" src="/harness/chart-line-checks.ts"></script>
    <script type="module" src="/harness/crop-checks.ts"></script>
    <script type="module" src="/harness/pin-front-checks.ts"></script>
    <script type="module" src="/harness/zoom-checks.ts"></script>
    <script type="module" src="/harness/page-mode-checks.ts"></script>
    <script type="module" src="/harness/theme-checks.ts"></script>
    <script type="module" src="/harness/beside-checks.ts"></script>
    <script type="module" src="/harness/mark-move-checks.ts"></script>
    <script type="module" src="/harness/eraser-checks.ts"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
